name: UNIT-01 Campaign Broadcast

# Reliability-first: GitHub's scheduled cron is often late/skipped, so instead of
# one tick per round we check every 10 min across a ~2h window around each round.
# send.py only sends a slot once its time has arrived (within DUE_WINDOW_MIN) and
# not yet sent; the "Persist sent state" step commits sent=true back so later
# ticks skip it, and the stable X-Line-Retry-Key is a second guard against resend.
# Windows (UTC = ICT-7): 09:00 ICT -> 02-03 UTC, 13:00 -> 06-07, 19:00 -> 12-13.
on:
  schedule:
    - cron: '*/10 2-3,6-7,12-13 16-20 11 *'
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run manually'
        type: choice
        default: list
        options: [list, validate, test, slot, due]
      slot:
        description: 'slot id (for test/slot), e.g. 1116-1900'
        default: '1116-1900'

permissions:
  contents: write

concurrency:
  group: unit01-broadcast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Broadcast / dispatch
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 send.py --due
          else
            case "${{ github.event.inputs.action }}" in
              list)     python3 send.py --list ;;
              validate) python3 send.py --validate ;;
              test)     python3 send.py --test "${{ github.event.inputs.slot }}" ;;
              slot)     python3 send.py --slot "${{ github.event.inputs.slot }}" ;;
              due)      python3 send.py --due ;;
            esac
          fi
      - name: Persist sent state
        if: always()
        run: |
          if ! git diff --quiet -- config/campaign.json; then
            git config user.name "campaign-bot"
            git config user.email "campaign-bot@users.noreply.github.com"
            git add config/campaign.json
            git commit -m "mark slot(s) sent [skip ci]"
            git push origin HEAD:main
          else
            echo "no state change"
          fi
